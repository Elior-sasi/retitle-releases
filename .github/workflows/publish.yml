name: Publish installer
# A build is dropped on branch "drop" as <100 MB parts (GitHub file limit). This workflow joins
# them, checks the hash, publishes the release with this repo's own token and removes the branch.
on:
  push:
    branches: [drop]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drop
      - name: Join and verify
        run: |
          cat parts/Retitle-Setup.exe.part* > Retitle-Setup.exe
          echo "$(cat parts/SHA256)  Retitle-Setup.exe" | sha256sum -c -
          echo "TAG=$(cat parts/TAG)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: Retitle ${{ env.TAG }}
          body: "להורדה: Retitle-Setup.exe למטה. מריצים, ומשם התוכנה מתעדכנת לבד."
          files: Retitle-Setup.exe
          make_latest: true
      - name: Remove the drop branch
        run: git push origin --delete drop
